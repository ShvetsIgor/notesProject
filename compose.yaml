services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: notes
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notes -d notes" ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db-data:
